spring:
  application:
    name: contact-management
  datasource:
    url: jdbc:h2:mem:contactdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
